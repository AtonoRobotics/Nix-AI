[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "habitat-state"
version = "0.1.0"
description = "Habitat authoritative state and evidence primitives"
requires-python = ">=3.11"
dependencies = ["boto3>=1.40", "psycopg>=3.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
