[package]
name = "habitat-effects"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
habitat-uds = { path = "../habitat-uds" }
habitat-authority = { path = "../habitat-authority" }
habitat-execution = { path = "../habitat-execution" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[[bin]]
name = "habitat-effects"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
