dependency_semantics:
  cannot_begin: "The dependent packet may not start implementation until every named packet has passed."
  cannot_integrate: "Exploration may proceed, but code or contracts may not merge until every named packet has passed and its consumed interfaces are stable."
  cannot_pass: "The packet may not be declared passed until every named packet has passed and the dependency is proven in integration evidence."
