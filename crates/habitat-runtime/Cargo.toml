[package]
name = "habitat-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
habitat-authority = { path = "../habitat-authority" }
habitat-effects = { path = "../habitat-effects" }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "habitat-runtime"
path = "src/main.rs"
