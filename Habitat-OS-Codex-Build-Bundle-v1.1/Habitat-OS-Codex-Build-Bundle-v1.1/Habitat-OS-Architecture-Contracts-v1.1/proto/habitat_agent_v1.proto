syntax = "proto3";

package habitat.agent.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service AgentRuntime {
  rpc GetActivation(GetActivationRequest) returns (ActivationEnvelope);
  rpc SubmitDisposition(SubmitDispositionRequest) returns (CommandResult);
  rpc GetCommandResult(GetCommandResultRequest) returns (CommandResult);
  rpc CancelActivation(CancelActivationRequest) returns (CommandResult);
}

message GetActivationRequest {
  string activation_id = 1;
  string activation_credential = 2;
}

message ActivationEnvelope {
  string abi_version = 1;
  string activation_id = 2;
  string agent_id = 3;
  repeated string objective_ids = 4;
  string wake_id = 5;
  string system_generation_id = 6;
  string capability_activation_set_id = 7;
  string context_bundle_id = 8;
  repeated string capability_grant_ids = 9;
  string isolation_profile_id = 10;
  string resource_lease_id = 11;
  google.protobuf.Timestamp deadline = 12;
  string trace_id = 13;
  string correlation_id = 14;
}

enum DispositionKind {
  DISPOSITION_KIND_UNSPECIFIED = 0;
  CONTEXT_REQUEST = 1;
  CAPABILITY_INVOCATION = 2;
  EFFECT_PROPOSAL = 3;
  DELEGATION = 4;
  MESSAGE = 5;
  CHECKPOINT = 6;
  SLEEP = 7;
  COMPLETION_CLAIM = 8;
  ACTIVATION_FAILURE = 9;
}

message SubmitDispositionRequest {
  string activation_id = 1;
  string command_id = 2;
  DispositionKind kind = 3;
  google.protobuf.Struct payload = 4;
  DecisionRecord decision_record = 5;
}

message DecisionRecord {
  string summary = 1;
  repeated string evidence_refs = 2;
}

message GetCommandResultRequest {
  string activation_id = 1;
  string command_id = 2;
}

message CancelActivationRequest {
  string activation_id = 1;
  string command_id = 2;
  string reason_code = 3;
}

enum RetryDisposition {
  RETRY_DISPOSITION_UNSPECIFIED = 0;
  NEVER = 1;
  SAME_ACTIVATION = 2;
  NEW_ACTIVATION = 3;
  AFTER_DEPENDENCY = 4;
  RECONCILE_ONLY = 5;
}

message CommandResult {
  string command_id = 1;
  bool committed = 2;
  string durable_record_id = 3;
  string state = 4;
  ErrorStatus error = 5;
  repeated string evidence_refs = 6;
}

message ErrorStatus {
  string code = 1;
  string message = 2;
  RetryDisposition retry_disposition = 3;
  string current_durable_state = 4;
  string safe_next_action = 5;
}

